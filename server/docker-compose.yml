services:
  postgres:
    image: postgres:16-alpine
    container_name: weconnect_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    shm_size: 128mb
    networks:
      - weconnect_network
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  redis:
    image: redis:7-alpine
    container_name: we-connect-redis
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - weconnect_network
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: we-connect-libretranslate
    restart: unless-stopped
    ports:
      - '127.0.0.1:5000:5000'
    environment:
      LT_LOAD_ONLY: 'en,vi,ja,zh'
      LT_UPDATE_MODELS: 'true'
      LT_THREADS: 4
      LT_SUGGESTIONS: 'false'
      LT_DISABLE_WEB_UI: 'false'
      LT_CHAR_LIMIT: 2000
      LT_REQ_LIMIT: 120
      LT_HOST: '0.0.0.0'
    volumes:
      - libretranslate_models:/home/libretranslate/.local
    healthcheck:
      test: ['CMD-SHELL', './venv/bin/python scripts/healthcheck.py']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5m
    networks:
      - weconnect_network
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  postgres_data:
    name: weconnect_postgres_data
  redis_data:
    name: weconnect_redis_data
  libretranslate_models:
    name: weconnect_libretranslate_models

networks:
  weconnect_network:
    name: weconnect_network
    driver: bridge
